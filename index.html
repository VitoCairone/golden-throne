<html>
<head>
</head>
<body>
  <div id="alt-view">

    <div id="start-screen">
      <button id="start-btn">New Game</button>  
    </div> 

    <div id="players-screen" style="display:flex">
      <button id="2-v-0">2 Players</button>
      <button id="1-v-1">1 Playwr vs 1 CPU</button>
      <button id="1-v-2">1 Player vs 2 CPU</button>
      <button id="2-v-1">2 Players vs 1 CPU</button>
      <button id="2-v-2">2 Players vs 2 CPU</button>
    </div>

    <div id="player-setup" style="display:none">
      <div>Player <span id="player-idx">1</span></div>
      <input id="name-inp" name="name" type="text">
      <select id="sex-sel">
        <option id="Male-opt" value="Male">Male</option>
        <option id="Female-opt" value="Female">Female</option>
      </select>
      <select id="job-sel">
        <option id="Warrior-opt" value="Warrior">Warrior</option>
        <option id="Thief-opt" value="Thief">Thief</option>
        <option id="Mage-opt" value="Mage">Mage</option>
      </select>
      <select id="color-sel">
        <option id="Red-opt" value="Red">Red</option>
        <option id="Green-opt" value="Green">Green</option>
        <option id="Blue-opt" value="Blue">Blue</option>
        <option id="Black-opt" value="Black">Black</option>
        <option id="Yellow-opt" value="Yellow">Yellow</option>
        <option id="Orange-opt" value="Orange">Orange</option>
        <option id="Pink-opt" value="Pink">Pink</option>
      </select>
      <button id="done-btn">Done</button>
    </div>

  </div>

  <div id="main-view" style="display: none">
    <div id="field"></div>
    <div id="controls">
      <button id="roll-btn"></button>
      <div id="player-name"></div>
      <div id="HP"></div>
      <div id="AT"></div>
      <div id="DF"></div>
      <div id="MG"></div>
      <div id="SP"></div>
      <div id="history"></div>
    </div>
  </div>

  <script src="./mapIngest.js"></script>
  <script src="./battle.js"></script>
  <script src="./cartog.js"></script>
  <script src="./mapLogic.js"></script>
  <script src="./gui.js"></script>
  <script src="./main.js"></script>
  <script src="./setupMenus.js"></script>
</body>
</html>
